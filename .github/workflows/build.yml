name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Swift toolchain
        run: swift --version
      - name: Test annotation engine
        run: swift test
      - name: Test signing and update guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "SCREENSCRIBE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Package explicit ad-hoc CI test app
        env:
          SCREENSCRIBE_SIGNING_IDENTITY: '-'
        run: scripts/package.sh
      - name: Preserve app archive
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScribe-macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenScribe-macos
          path: dist
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
